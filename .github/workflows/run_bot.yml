name: Generate Kurti Scripts

on:
  schedule:
    - cron: '0 8 * * *' # Automatically runs every single day at 8:00 AM
  workflow_dispatch: # Adds the manual "Run workflow" trigger button back to your dashboard

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4
      
      - name: Set up Python Engine
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install -r requirements.txt
      
      - name: Run script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDS }}
          DRIVE_FILE_ID: ${{ secrets.DRIVE_FILE_ID }} 
          INSTAGRAM_TOKEN: ${{ secrets.INSTAGRAM_TOKEN }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
        run: python main.py

